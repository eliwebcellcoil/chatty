version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatty-db
    environment:
      POSTGRES_USER: chatty
      POSTGRES_PASSWORD: chatty_secret
      POSTGRES_DB: chatty
    ports:
      - "5432:5432"
    volumes:
      - chatty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatty"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chatty_pgdata:
